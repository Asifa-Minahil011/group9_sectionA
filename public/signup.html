<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BudgetWise - Sign Up</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  
<h1 style="color:#1565c0; text-align:center; font-family:'Georgia',serif; margin-bottom:20px;">BudgetWise</h1>
  <div class="form-container">
    <h2 class="form-title">Sign up</h2>
    <label for="signupName">Full Name</label>
    <input type="text" id="signupName" placeholder="Type your name" required>
    <label for="signupEmail">Email</label>
    <input type="email" id="signupEmail" placeholder="Type your email" required>
   
    <label for="signupPassword">Password</label>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <button onclick="signup()">Sign up</button>
       <div class="switch-link">
      <a href="index.html">Already have an account? Sign in</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
